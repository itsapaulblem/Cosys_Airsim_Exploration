# Integrated Monitoring Stack for AirSim Ecosystem
# Connects to AirSim networks and includes custom metrics exporters

version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus-integrated.yml:/etc/prometheus/prometheus.yml
      - /home/mnsuser/monitoring/prometheus_db:/var/lib/prometheus
      - ./alerts:/etc/prometheus/alerts
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.route-prefix=/'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    ports:
      - '9090:9090'
    networks:
      - monitor-net
      - airsim-ecosystem
      - px4_network
      - ros2-multi-node-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    ports:
      - '8080:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitor-net
      - airsim-ecosystem
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - '9100:9100'
    networks:
      - monitor-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "1000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=P@ssw0rd
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - /home/mnsuser/monitoring/grafana_db:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    ports:
      - '3000:3000'
    networks:
      - monitor-net
      - airsim-ecosystem
    restart: unless-stopped

  # Custom Exporters
  ros2-exporter:
    build:
      context: /home/mnsuser/Cosys_Airsim_Exploration
      dockerfile: docker/monitoring/exporters/Dockerfile.exporters
    image: airsim-metrics-exporters:latest
    container_name: ros2-metrics-exporter
    environment:
      - EXPORTER_TYPE=ros2
      - ROS_DOMAIN_ID=0
    ports:
      - '9200:9200'
    networks:
      - monitor-net
      - ros2-multi-node-network
      - airsim-ecosystem
    restart: unless-stopped
    depends_on:
      - prometheus

  airsim-exporter:
    image: airsim-metrics-exporters:latest
    container_name: airsim-api-exporter
    environment:
      - EXPORTER_TYPE=airsim
      - AIRSIM_HOST_IP=airsim-container
      - AIRSIM_HOST_PORT=41451
      - METRICS_PORT=9201
      - POLL_INTERVAL=1.0
    ports:
      - '9201:9201'
    networks:
      - monitor-net
      - airsim-ecosystem
    restart: unless-stopped
    depends_on:
      - prometheus

  px4-exporter:
    image: airsim-metrics-exporters:latest
    container_name: px4-mavlink-exporter
    environment:
      - EXPORTER_TYPE=px4
      - PX4_NUM_DRONES=4
      - PX4_BASE_PORT=14550
      - METRICS_PORT=9202
    ports:
      - '9202:9202'
    networks:
      - monitor-net
      - px4_network
      - airsim-ecosystem
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  monitor-net:
    driver: bridge

  # External networks from AirSim ecosystem
  airsim-ecosystem:
    external: true
  px4_network:
    external: true
  ros2-multi-node-network:
    external: true

volumes:
  prometheus_db:
  grafana_db:
