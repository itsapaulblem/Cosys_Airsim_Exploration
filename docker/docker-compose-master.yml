# Master AirSim Ecosystem Docker Compose - Clean Orchestration
# Orchestrates specialized compose files for PX4 and ROS2 subsystems

name: tevv-airstack
# 
# CONFIGURABLE DRONE COUNT (1-6 drones supported):
# Each PX4 drone runs proper SITL with ./Scripts/run_airsim_sitl.sh <instance_id>
# Instance mapping: drone-1=0, drone-2=1, drone-3=2, drone-4=3, drone-5=4, drone-6=5
#
# CONFIGURATION:
# - Use get-wsl2-ip.ps1 or mnstevv-auto.bat for automatic WSL2 IP detection
# - Set AIRSIM_HOST_IP and PX4_SIM_HOSTNAME environment variables
# - Requires PROJECT_ROOT to be set in .env file (see docker/.env)
# - Automatically applies RPC library -fPIC fix from ${PROJECT_ROOT}/ros2/fix_rpc_build.sh
# - Mounts only the fix script (not entire directory) to avoid package duplication
# - Rebuilds rpclib with Position Independent Code for modern Linux systems
# - Ensures ROS2 nodes compile successfully and rpc_dynamic_vehicles.launch.py works
#
# Usage Examples:
#   # Default 3-drone setup
#   docker-compose -f docker-compose-master.yml --profile integrated up
#
#   # Single drone testing
#   docker-compose -f docker-compose-master.yml --profile integrated up px4-bridge-drone-1 ros2-multi-node
#
#   # Large swarm (6 drones)
#   docker-compose -f docker-compose-master.yml --profile integrated up px4-bridge-drone-{1..6} ros2-multi-node
#
#   # WITH MONITORING (Prometheus + Grafana + Alerts)
#   docker-compose -f docker-compose-master.yml --profile linux-integrated --profile monitoring up
#   # Access: Grafana http://localhost:3000 (admin/P@ssw0rd), Prometheus http://localhost:9090
#
#   # Profile-based deployment
#   docker-compose -f docker-compose-master.yml --profile px4-only up      # PX4 swarm only
#   docker-compose -f docker-compose-master.yml --profile ros2-only up     # ROS2 multi-node only
#   docker-compose -f docker-compose-master.yml --profile development up   # Development environment
#   docker-compose -f docker-compose-master.yml --profile monitoring up    # Monitoring only (requires ecosystem networks)
#
#   # LINUX NATIVE X11 FORWARDING (60-70% lower resource usage)
#   # Prerequisites: xhost +local:docker
#   docker-compose -f docker-compose-master.yml --profile linux-integrated up
#
#   # Linux X11 with specific services
#   xhost +local:docker
#   docker-compose -f docker-compose-master.yml --profile linux-integrated up airsim-container px4-bridge-drone-{1..3} ros2-x11-node
#
#   # Platform Selection:
#   # - Linux native:        --profile linux-integrated   (X11 forwarding, max performance)
#   # - Windows/Mac/Remote:  --profile integrated         (VNC, cross-platform)
#   # - With monitoring:     --profile linux-integrated --profile monitoring  (includes Prometheus/Grafana)

# =================================
# SHARED NETWORKS FOR INTEGRATION
# =================================
networks:
  # Bridge network for cross-ecosystem communication
  airsim-ecosystem:
    name: airsim-ecosystem
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
  
  # External networks from specialized compose files
  px4_network:
    name: px4_network  
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
        
  ros2-multi-node-network:
    name: ros2-multi-node-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16

  # Linux X11 ROS2 network (for native X11 forwarding setup)
  ros2-x11-network:
    name: ros2-x11-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.27.0.0/16

  # PostgreSQL internal network for database cluster communication
  # postgres-internal:
  #   name: postgres-internal
  #   driver: bridge
  #   ipam:
  #     config:
  #       - subnet: 172.25.0.0/16

# =================================
# SHARED ENVIRONMENT TEMPLATES
# =================================
x-airsim-common-env: &airsim-env
  # AirSim Connection (configurable via .env file)
  AIRSIM_HOST_IP: ${AIRSIM_HOST_IP:-airsim-container}
  AIRSIM_HOST_PORT: ${AIRSIM_HOST_PORT:-41451}
  
  # ROS2 Configuration  
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  
  # Multi-node Architecture
  LAUNCH_MODE: ${LAUNCH_MODE:-multi}
  ENABLE_COORDINATION: ${ENABLE_COORDINATION:-true}
  RPC_TIMEOUT: ${RPC_TIMEOUT:-10.0}
  DEBUG: ${DEBUG:-false}

x-px4-common-env: &px4-env
  # PX4 Simulation Configuration
  PX4_SIM_HOSTNAME: ${PX4_SIM_HOSTNAME:-airsim-container}
  PX4_SIM_MODEL: ${PX4_SIM_MODEL:-none_iris}
  PX4_SIMULATOR: none
  PX4_HOME_LAT: ${PX4_HOME_LAT:-43.06659659989448}
  PX4_HOME_LON: ${PX4_HOME_LON:--115.59330958}
  PX4_HOME_ALT: ${PX4_HOME_ALT:-0.0}
  PX4_SYS_AUTOSTART: ${PX4_SYS_AUTOSTART:-10016}
  
  # MAVLink Configuration
  MAV_0_BROADCAST: 1
  MAV_1_BROADCAST: 1
  MAV_2_BROADCAST: 1
  
  # Swarm Configuration
  SWARM_ID: ${SWARM_ID:-1}
  SWARM_SIZE: ${SWARM_SIZE:-3}
  
  # Drone spawning configuration
  MAX_DRONES: ${MAX_DRONES:-3}

