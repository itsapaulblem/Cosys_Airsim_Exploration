# =================================
# ORCHESTRATED SERVICES 
# =================================
services:

  # =================================
  # ROS2 Multi-Node Architecture
  # =================================
  ros2-multi-node:
    extends:
      file: airsim_ros2_wrapper/docker-compose.yml
      service: ros2-multi-node
    container_name: ros2-node
    hostname: ros2
    # Simplified command - packages are pre-built during image creation
    command: >
      bash -c "
        echo 'Using AIRSIM_HOST_IP: '$$AIRSIM_HOST_IP &&
        echo 'ROS2 packages pre-built during image creation (PIE-compliant)' &&
        source /opt/ros/humble/setup.bash &&
        source /airsim_ros2_ws/install/setup.bash &&
        echo 'ROS2 environment ready for rpc_dynamic_vehicles.launch.py' &&
        exec /entrypoint_lightweight.sh
      "
    environment:
      # ROS2 Configuration  
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      # Multi-node Architecture
      LAUNCH_MODE: ${LAUNCH_MODE:-multi}
      ENABLE_COORDINATION: ${ENABLE_COORDINATION:-true}
      RPC_TIMEOUT: ${RPC_TIMEOUT:-10.0}
      DEBUG: ${DEBUG:-false}
      # VNC Configuration
      DISPLAY: ":1"
      VNC_PORT: 5901
      RESOLUTION: "1920x1080"
      USER: Aortz
      PASSWD: ubuntu
      LAUNCH_RVIZ: ${LAUNCH_RVIZ:-false}
      # AirSim connection (set via environment variables)
      AIRSIM_HOST_IP: ${AIRSIM_HOST_IP:-airsim-container}
      AIRSIM_HOST_PORT: ${AIRSIM_HOST_PORT:-41451}
    # Note: RPC fix script volume mount removed - PIE fix applied during image build
    networks:
      - airsim-ecosystem
      - ros2-multi-node-network
    profiles:
      - ros2-only
      - integrated
      - development

  # =================================
  # ROS2 X11 Forwarding (Linux Native)
  # =================================
  ros2-x11-node:
    extends:
      file: airsim_ros2_wrapper/Linux/docker-compose.yml
      service: ros2-x11-node
    container_name: ros2-x11-node
    hostname: ros2-x11

    # Override environment to use master's config
    environment:
      # X11 Display Forwarding (host variables)
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - QT_X11_NO_MITSHM=1

      # Inherit ROS2 config from master .env
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - AIRSIM_HOST_IP=${AIRSIM_HOST_IP:-airsim-container}
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}

      # Multi-node architecture
      - LAUNCH_MODE=${LAUNCH_MODE:-multi}
      - ENABLE_COORDINATION=${ENABLE_COORDINATION:-true}
      - RPC_TIMEOUT=${RPC_TIMEOUT:-10.0}
      - LAUNCH_RVIZ=${LAUNCH_RVIZ:-false}
      - DEBUG=${DEBUG:-false}
      - AUTO_BUILD=${AUTO_BUILD:-true}

      # MAVROS configuration for PX4 connection
      - MAVROS_FCU_URL=${MAVROS_FCU_URL:-udp://px4-drone-1:14540@14550}
      - MAVROS_NUM_DRONES=${MAVROS_NUM_DRONES:-4}
      - MAVROS_USE_HOST_NETWORK=${MAVROS_USE_HOST_NETWORK:-false}
      # MAVROS network mode: bridge (default), host, or localhost
      # - bridge: ROS2 bridge → PX4 bridge (udp://px4-drone-{i}:14540@14550)
      # - host: ROS2 bridge → PX4 host (udp://host.docker.internal:14540@14550)
      # - localhost: ROS2 host → PX4 host (udp://localhost:14540@14550)
      - MAVROS_PX4_NETWORK_MODE=${MAVROS_PX4_NETWORK_MODE:-bridge}

    # Override networks to use master's unified network
    # IMPORTANT: Must be on px4_network to reach PX4 containers via DNS
    networks:
      - airsim-ecosystem
      - ros2-multi-node-network
      - px4_network  # Added: Required for MAVROS to connect to PX4 containers

    # Add dependency on AirSim and PX4 (at least one drone)
    depends_on:
      airsim-container:
        condition: service_healthy
      px4-bridge-drone-1:
        condition: service_started

    # Linux-specific profile
    profiles:
      - linux-integrated
      - linux-dev
      - development

  # =================================
  # YOLOV10 DETECTION MICROSERVICE
  # =================================
  yolov10-detection-service:
    build:
      context: ${PROJECT_ROOT:-.}/docker/yolo_detection_service
      dockerfile: Dockerfile
    image: yolov10-detection-service:latest
    container_name: yolov10-detection
    hostname: yolov10-detection

    # GPU Runtime Configuration for 100x YOLO inference speedup
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    environment:
      # ROS2 Configuration
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ROS_LOCALHOST_ONLY=0

      # Detection Service Parameters
      - CONF_THRESHOLD=${DETECTION_CONF_THRESHOLD:-0.25}
      - IOU_THRESHOLD=${DETECTION_IOU_THRESHOLD:-0.45}
      - MODEL_NAME=${YOLO_MODEL_NAME:-jameslahm/yolov10n}

      # Class Filtering (Runtime Configurable via ROS2 params)
      # Default: Track people and vehicles only (person, car, truck, bus, motorcycle)
      # To detect all 80 COCO classes, set ENABLE_CLASS_FILTER=false
      - ALLOWED_CLASSES=${ALLOWED_CLASSES:-person,car,truck,bus,motorcycle}
      - ENABLE_CLASS_FILTER=${ENABLE_CLASS_FILTER:-false}

    volumes:
      # Mount full YOLOv10-DeepSORT repository (includes yolov10/ subdirectory)
      - ${PROJECT_ROOT:-.}/ros2/src/airsim_ros_pkgs/scripts/YOLOv10-DeepSORT:/detection_ws/yolov10_tracking:ro

      # Mount detection service node
      - ${PROJECT_ROOT:-.}/docker/yolo_detection_service/detection_service_node.py:/detection_ws/detection_service_node.py:ro

      # Mount ONLY the ROS2 install directory (not entire filesystem) for airsim_interfaces access
      # This avoids Python package conflicts from volumes_from
      - ros2_x11_install:/airsim_ros2_ws/install:ro

    networks:
      - airsim-ecosystem
      - ros2-multi-node-network
      - ros2-x11-network

    # Wait for ROS2 workspace to be ready
    depends_on:
      ros2-x11-node:
        condition: service_started

    restart: unless-stopped

    # Available in integrated profiles
    profiles:
      - linux-integrated
      - integrated
      - development

    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'from ultralytics import YOLOv10; import rclpy' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =================================
  # PX4 Swarm Services (Selective)
  # =================================
  px4-bridge-drone-1:
    extends:
      file: px4_airsim_docker/docker-compose-px4.yml
      service: px4-bridge-drone-1
    build:
      context: ./px4_airsim_docker
      dockerfile: Dockerfile.px4
    image: px4-airsim:px4
    container_name: px4-drone-1
    hostname: px4-drone-1
    depends_on:
      airsim-container:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Using PX4_SIM_HOSTNAME: '$$PX4_SIM_HOSTNAME &&
        echo 'Waiting for AirSim simulation to fully initialize...' &&
        sleep 20 &&
        cd /px4_workspace/PX4-Autopilot &&
        echo 'Starting PX4 SITL for drone 1 (instance 0)...' &&
        exec ./Scripts/run_airsim_sitl.sh 0
      "
    environment:
      # Use environment template but allow override by detected IP
      PX4_SIM_HOSTNAME: ${PX4_SIM_HOSTNAME:-airsim-container}
      PX4_SIM_MODEL: ${PX4_SIM_MODEL:-none_iris}
      PX4_SIMULATOR: none
      PX4_HOME_LAT: ${PX4_HOME_LAT:-43.06659659989448}
      PX4_HOME_LON: ${PX4_HOME_LON:--115.59330958}
      PX4_HOME_ALT: ${PX4_HOME_ALT:-0.0}
      PX4_SYS_AUTOSTART: ${PX4_SYS_AUTOSTART:-10016}
      PX4_INSTANCE: 0
      MAV_0_BROADCAST: 1
      MAV_1_BROADCAST: 1
      MAV_2_BROADCAST: 1
      SWARM_ID: ${SWARM_ID:-1}
      SWARM_SIZE: ${SWARM_SIZE:-3}
    networks:
      - airsim-ecosystem
      - px4_network
    profiles:
      - px4-only
      - integrated
      - linux-integrated
      - development

