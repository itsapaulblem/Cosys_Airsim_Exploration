      PX4_HOME_LON: ${PX4_HOME_LON:--115.59330958}
      PX4_HOME_ALT: ${PX4_HOME_ALT:-0.0}
      PX4_SYS_AUTOSTART: ${PX4_SYS_AUTOSTART:-10016}
      PX4_INSTANCE: 6
      MAV_0_BROADCAST: 1
      MAV_1_BROADCAST: 1
      MAV_2_BROADCAST: 1
      SWARM_ID: ${SWARM_ID:-1}
      SWARM_SIZE: ${SWARM_SIZE:-3}
    networks:
      - airsim-ecosystem
      - px4_network
    depends_on:
      airsim-container:
        condition: service_healthy
      px4-bridge-drone-1:
        condition: service_started
    restart: unless-stopped
    profiles:
      - px4-only
      # - integrated
      - development
      # - linux-integrated

  # =================================
  # GROUND CONTROL STATION SERVICES
  # =================================

  qgroundcontrol:
    build:
      context: qgroundcontrol
      dockerfile: Dockerfile.qgc
    image: airsim-qgc:latest
    container_name: qgroundcontrol
    hostname: qgc

    # Connect to PX4 network for MAVLink communication
    # and airsim-ecosystem for coordination
    networks:
      - px4_network
      - airsim-ecosystem

    # Expose VNC ports only
    # MAVLink communication happens within px4_network (no host port mapping needed)
    ports:
      - "5900:5900"          # VNC server
      - "6080:6080"          # noVNC web interface

    environment:
      # VNC configuration
      - DISPLAY=:1
      - VNC_PASSWORD=${QGC_VNC_PASSWORD:-airsim}
      - VNC_RESOLUTION=${QGC_VNC_RESOLUTION:-1920x1080}

      # QGroundControl configuration
      - QGC_APPIMAGE=/opt/qgroundcontrol/QGroundControl.AppImage
      - APPIMAGE_EXTRACT_AND_RUN=1  # Run AppImage without FUSE (container-friendly)

      # MAVLink configuration
      # QGC listens on UDP 14550 by default
      # PX4 instances broadcast to this port (MAV_1_BROADCAST=1)

    # Wait for at least one PX4 drone to be ready
    depends_on:
      px4-bridge-drone-1:
        condition: service_started

    restart: unless-stopped

    # Available in multiple profiles
    profiles:
      - integrated         # Full stack deployment
      - px4-only          # PX4 swarm with GCS
      - gcs-tools         # GCS utilities only
      - development       # Development environment
      # - linux-integrated  # Linux native deployment

  # =================================
  # QGroundControl X11 (Linux Native)
  # =================================
  qgroundcontrol-x11:
    build:
      context: qgroundcontrol
      dockerfile: Dockerfile.qgc-x11
    image: airsim-qgc-x11:latest
    container_name: qgroundcontrol-x11
    hostname: qgc-x11

    # Connect to PX4 network for MAVLink communication
    # and airsim-ecosystem for coordination
    networks:
      - px4_network
      - airsim-ecosystem

    # X11 Socket forwarding (NO port mapping needed - uses host display)
    # MAVLink communication happens within px4_network (no host port mapping needed)
    # No ports section needed - X11 uses socket forwarding, MAVLink uses internal network

    environment:
      # X11 Display Forwarding (CRITICAL for GUI)
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=/tmp/.Xauthority
      - QT_X11_NO_MITSHM=1  # Fix for Qt apps in containers

      # QGroundControl configuration
      - QGC_APPIMAGE=/opt/qgroundcontrol/QGroundControl.AppImage
      - APPIMAGE_EXTRACT_AND_RUN=1  # Run AppImage without FUSE (container-friendly)

      # Graphics configuration (fallback to software rendering if GPU unavailable)
      - LIBGL_ALWAYS_SOFTWARE=1

      # MAVLink configuration
      # QGC listens on UDP 14550 by default
      # PX4 instances broadcast to this port (MAV_1_BROADCAST=1)

    volumes:
      # X11 Socket Forwarding (CRITICAL for GUI apps)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # X11 Authentication (CRITICAL for security)
      - ${XAUTHORITY:-$HOME/.Xauthority}:/tmp/.Xauthority:ro

      # QGroundControl Configuration Template (optional - for bridge network mode)
      # Auto-generated comm links for PX4 drones
      # Generate with: cd qgroundcontrol && python3 generate_qgc_config.py
      # Template mounted read-only, injected on startup if no config exists
      # Comment out to disable auto-configuration (not needed in hybrid/host network mode)
      - ./qgroundcontrol/qgc_config:/config-template:ro

      # QGroundControl Persistent User Configuration
      # Survives container restarts (compose down/up)
      # Template auto-injected on first run if this directory is empty
      # User modifications (custom comm links, UI settings) persist here
      - ./qgroundcontrol/user_config:/home/qgc/.config/QGroundControl

    # GPU device access for hardware acceleration (optional, gracefully degrades to software rendering)
    devices:
      - /dev/dri:/dev/dri

    # Shared memory size for X11 applications (increases from default 64MB)
    shm_size: '2gb'

    # GPU Configuration for hardware acceleration
    # NVIDIA GPU support (uncomment if available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, compute, utility, graphics]

    # Security Options for X11
    security_opt:
      - seccomp:unconfined  # Required for some X11 operations

    # Run as host user to match X11 permissions
    user: "${UID:-1000}:${GID:-1000}"

    # Add user to video group for GPU access
    group_add:
      - video

    # Proper init system for signal handling
    init: true

    # Wait for at least one PX4 drone to be ready
    depends_on:
      px4-bridge-drone-1:
        condition: service_started

    restart: unless-stopped

    # Linux native performance profiles only
    profiles:
      - linux-integrated  # Linux native deployment
      - linux-dev         # Linux development
      - development       # Development environment

    # Health check using X11 connection test
    healthcheck:
      test: ["CMD-SHELL", "xdpyinfo > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

