  # =================================
  # AIRSIM CONTAINERIZED SERVICES
  # =================================

  airsim-container:
    extends:
      file: unreal_executable/docker-compose-binary.yml
      service: airsim-container
    image: ${DOCKER_IMAGE_NAME}
    container_name: airsim-container
    hostname: airsim-container
    user: "${UID}:${GID}"
    shm_size: '4gb'  # Critical for GPU LiDAR high-bandwidth point clouds (10-50 MB per frame)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    networks:
      - airsim-ecosystem
      - px4_network
      - ros2-multi-node-network
    profiles:
      - integrated
      - linux-integrated
      - development

  # =================================
  # SHARED INFRASTRUCTURE SERVICES
  # =================================
  
  # Cross-Ecosystem Network Monitor
  ecosystem-monitor:
    image: alpine:latest
    container_name: airsim-monitor
    command: >
      sh -c "
        apk add --no-cache curl netcat-openbsd nmap &&
        echo 'AirSim Ecosystem Monitor Started' &&
        while true; do
          echo '╭─── Ecosystem Status: $(date) ───────╮' &&
          echo '│ Testing AirSim API Connection...' &&
          timeout 3 nc -zv ${AIRSIM_HOST_IP:-airsim-container} ${AIRSIM_HOST_PORT:-41451} 2>&1 | head -1 &&
          echo '╰─────────────────────────────────────╯' &&
          sleep 60
        done
      "
    networks:
      - airsim-ecosystem
      - px4_network
      - ros2-multi-node-network
    environment:
      # AirSim Connection (configurable via .env file)
      AIRSIM_HOST_IP: ${AIRSIM_HOST_IP:-airsim-container}
      AIRSIM_HOST_PORT: ${AIRSIM_HOST_PORT:-41451}
      
      # ROS2 Configuration  
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      
      # Multi-node Architecture
      LAUNCH_MODE: ${LAUNCH_MODE:-multi}
      ENABLE_COORDINATION: ${ENABLE_COORDINATION:-true}
      RPC_TIMEOUT: ${RPC_TIMEOUT:-10.0}
      DEBUG: ${DEBUG:-false}
      
      # PX4 Simulation Configuration
      PX4_SIM_HOSTNAME: ${PX4_SIM_HOSTNAME:-airsim-container}
      PX4_SIM_MODEL: ${PX4_SIM_MODEL:-none_iris}
      PX4_SIMULATOR: none
      PX4_HOME_LAT: ${PX4_HOME_LAT:-43.06659659989448}
      PX4_HOME_LON: ${PX4_HOME_LON:--115.59330958}
      PX4_HOME_ALT: ${PX4_HOME_ALT:-0.0}
      PX4_SYS_AUTOSTART: ${PX4_SYS_AUTOSTART:-10016}
      
      # MAVLink Configuration
      MAV_0_BROADCAST: 1
      MAV_1_BROADCAST: 1
      MAV_2_BROADCAST: 1
      
      # Swarm Configuration
      SWARM_ID: ${SWARM_ID:-1}
      SWARM_SIZE: ${SWARM_SIZE:-3}
    depends_on:
      airsim-container:
        condition: service_healthy
      # - px4-bridge-drone-1
    restart: unless-stopped
    profiles:
      - integrated
      # - linux-integrated
      - development

  # Development Helper Service
  dev-helper:
    image: alpine:latest
    container_name: airsim-dev-helper
    command: >
      sh -c "
        apk add --no-cache curl jq netcat-openbsd &&
        echo 'Development Helper Service Started' &&
        echo 'Available Commands:' &&
        echo '  - docker exec -it airsim-dev-helper sh' &&
        echo '  - Network diagnostics and debugging tools' &&
        echo '  - Configuration validation' &&
        echo 'Sleeping... (use docker exec to access)' &&
        while true; do sleep 3600; done
      "
    networks:
      - airsim-ecosystem  
      - px4_network
      - ros2-multi-node-network
    volumes:
      # Mount compose files for inspection
      - ./:/docker-configs:ro
    restart: unless-stopped
    profiles:
      - development

  # =================================
  # MONITORING SERVICES
  # =================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus-integrated.yml:/etc/prometheus/prometheus.yml
      - /home/mnsuser/monitoring/prometheus_db:/var/lib/prometheus
      - ./monitoring/alerts:/etc/prometheus/alerts
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.route-prefix=/'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.min-block-duration=2h'  # OPTIMIZED: Reduce write frequency
      - '--storage.tsdb.max-block-duration=2h'  # OPTIMIZED: Consistent block size
    restart: unless-stopped
    ports:
      - '9090:9090'
    networks:
      - airsim-ecosystem
      - px4_network
      - ros2-multi-node-network
    depends_on:
      airsim-container:
        condition: service_healthy
    profiles:
      - monitoring
      - integrated
      - linux-integrated

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "1000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=P@ssw0rd
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - /home/mnsuser/monitoring/grafana_db:/var/lib/grafana
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    ports:
      - '3000:3000'
    networks:
      - airsim-ecosystem
    restart: unless-stopped
    profiles:
      - monitoring
      - integrated
      - linux-integrated

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    privileged: true
    ports:
      - '8080:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - airsim-ecosystem
    restart: unless-stopped
    profiles:
      - monitoring
      - integrated
      - linux-integrated

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - '9100:9100'
    networks:
      - airsim-ecosystem
    restart: unless-stopped
    profiles:
      - monitoring
      - integrated
      - linux-integrated

  ros2-exporter:
    build:
      context: ${PROJECT_ROOT:-.}
      dockerfile: docker/monitoring/exporters/Dockerfile.exporters
    image: airsim-metrics-exporters:latest
    container_name: ros2-metrics-exporter
    environment:
      - EXPORTER_TYPE=ros2
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    ports:
      - '9200:9200'
    networks:
      - ros2-multi-node-network
      - airsim-ecosystem
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring
      - integrated
      - linux-integrated

  airsim-exporter:
    image: airsim-metrics-exporters:latest
    container_name: airsim-api-exporter
    environment:
      - EXPORTER_TYPE=airsim
      - AIRSIM_HOST_IP=${AIRSIM_HOST_IP:-airsim-container}
      - AIRSIM_HOST_PORT=${AIRSIM_HOST_PORT:-41451}
      - METRICS_PORT=9201
      - POLL_INTERVAL=1.0
    ports:
      - '9201:9201'
    networks:
      - airsim-ecosystem
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
      airsim-container:
        condition: service_healthy
    profiles:
      - monitoring
      - integrated
      - linux-integrated

  px4-exporter:
    image: airsim-metrics-exporters:latest
    container_name: px4-mavlink-exporter
    environment:
      - EXPORTER_TYPE=px4
      - PX4_NUM_DRONES=${PX4_NUM_DRONES:-4}
      - PX4_BASE_PORT=14550
      - METRICS_PORT=9202
    ports:
      - '9202:9202'
    networks:
      - px4_network
      - airsim-ecosystem
    restart: unless-stopped
    depends_on:
      - prometheus
    profiles:
      - monitoring
      - integrated
      - linux-integrated

