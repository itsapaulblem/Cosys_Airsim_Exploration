  vnc_home:
    driver: local

  # Linux X11 ROS2 volumes (for native X11 forwarding)
  ros2_x11_build:
    driver: local
  ros2_x11_install:
    driver: local
  ros2_x11_logs:
    driver: local

  # PX4 volumes for ecosystem services
  px4-shared-data:
    driver: local
    
