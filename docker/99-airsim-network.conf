# AirSim Multi-Drone Simulation Network Optimization
# Apply with: sudo cp 99-airsim-network.conf /etc/sysctl.d/ && sudo sysctl --system
# Or temporarily: sudo sysctl -p 99-airsim-network.conf

# ============================================
# UDP BUFFER OPTIMIZATION (Critical for MAVLink/ROS2 DDS)
# ============================================

# Maximum UDP receive buffer size (128 MB)
# Prevents packet drops during high-rate sensor streaming from AirSim
net.core.rmem_max = 134217728

# Maximum UDP send buffer size (128 MB)
# Ensures smooth MAVLink command transmission to multiple drones
net.core.wmem_max = 134217728

# Default receive buffer (16 MB)
net.core.rmem_default = 16777216

# Default send buffer (16 MB)
net.core.wmem_default = 16777216

# UDP memory allocation limits (min, pressure, max in pages)
# 8GB min, 16GB pressure point, 32GB max
net.ipv4.udp_mem = 8388608 16777216 33554432

# ============================================
# NETWORK DEVICE QUEUE OPTIMIZATION
# ============================================

# Increase packet queue size for high packet rates
# Prevents drops when multiple drones transmit simultaneously
net.core.netdev_max_backlog = 30000

# Increase number of incoming connection slots
net.core.somaxconn = 8192

# ============================================
# TCP OPTIMIZATION (for AirSim API and Docker communication)
# ============================================

# Enable TCP Fast Open for reduced connection latency
# 3 = enable for both client and server
net.ipv4.tcp_fastopen = 3

# Reduce TCP latency by prioritizing low-latency transmission
net.ipv4.tcp_low_latency = 1

# Disable slow start after idle to maintain throughput
net.ipv4.tcp_slow_start_after_idle = 0

# Enable TCP window scaling for high-bandwidth connections
net.ipv4.tcp_window_scaling = 1

# TCP send/receive buffer auto-tuning ranges (min, default, max)
# 4KB min, 16MB default, 128MB max
net.ipv4.tcp_rmem = 4096 16777216 134217728
net.ipv4.tcp_wmem = 4096 16777216 134217728

# ============================================
# ROUTING AND CONNECTION TRACKING
# ============================================

# Increase connection tracking table size for multi-drone swarms
net.netfilter.nf_conntrack_max = 1048576

# Faster timeout for closed connections (reduces table bloat)
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 60

# ============================================
# LOCAL LOOPBACK OPTIMIZATION (for host network mode)
# ============================================

# Increase local port range for multi-container deployments
net.ipv4.ip_local_port_range = 15000 65535

# Enable reverse path filtering (security + performance)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ============================================
# MULTICAST OPTIMIZATION (for ROS2 DDS discovery)
# ============================================

# Increase multicast membership limits (ROS2 DDS uses multicast heavily)
net.ipv4.igmp_max_memberships = 1024

# ============================================
# MEMORY AND CACHE OPTIMIZATION
# ============================================

# Reduce swappiness to keep network buffers in RAM
vm.swappiness = 10

# Increase percentage of memory that can be used for network buffers
vm.min_free_kbytes = 65536

# ============================================
# VERIFICATION COMMANDS
# ============================================
# After applying, verify with:
#   sysctl net.core.rmem_max
#   sysctl net.core.wmem_max
#   sysctl net.ipv4.tcp_fastopen
#
# Monitor buffer usage with:
#   netstat -su | grep -i "buffer"
#   ss -m
#
# Test network performance:
#   iperf3 -s  (on server)
#   iperf3 -c <server_ip> -u -b 1G -t 30  (on client)
